name: ANACLETO CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile for declared security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report full dependency audit
        run: |
          npm audit --audit-level=moderate || {
            echo "::warning::Full audit still reports the upstream picomatch advisory in development/build tooling. No patched picomatch release is currently available; keep it out of runtime dependencies and monitor upstream."
          }
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
