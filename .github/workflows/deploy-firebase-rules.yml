name: Deploy Firebase Security Rules

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm publishing Firestore and Storage rules to anacleto-e2bca production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-production-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    if: inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: anacleto-e2bca
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate server-only Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_JSON as a GitHub Actions secret before running this workflow."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8")); if(s.project_id !== process.env.FIREBASE_PROJECT_ID) { console.error("Service account project_id does not match target project."); process.exit(1); }'

      - name: Publish Firestore and Storage rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
