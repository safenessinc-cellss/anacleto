name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Block releases on moderate/high issues in runtime dependencies.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Vite's build-only dependency tree currently includes picomatch <=4.0.7.
      # Upstream has not published a fixed release for GHSA-fc5q-39xc-vjpf yet.
      # Keep the full report visible but non-blocking until a supported patch exists;
      # never force an unreviewed git fork into the production build.
      - name: Full dependency audit (development advisories tracked)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit --pretty false

      - name: Production build
        run: npm run build
